<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .trip-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .trip-type label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 600;
            color: #34495e;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #4b5563;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>Book Your Flight</h2>
    
    <form action="/search-flights" method="GET">
        
        <!-- Trip Type Selection -->
        <div class="trip-type">
            <label>
                <input type="radio" name="trip_type" value="round-trip" checked> Round Trip
            </label>
            <label>
                <input type="radio" name="trip_type" value="one-way"> One Way
            </label>
        </div>

        <!-- Origin and Destination -->
        <div class="form-row">
            <div class="form-group">
                <label for="from">From</label>
                <input type="text" id="from" name="origin" placeholder="City or Airport" required>
            </div>
            <div class="form-group">
                <label for="to">To</label>
                <input type="text" id="to" name="destination" placeholder="City or Airport" required>
            </div>
        </div>

        <!-- Dates -->
        <div class="form-row">
            <div class="form-group">
                <label for="departure-date">Departure Date</label>
                <input type="date" id="departure-date" name="departure_date" required>
            </div>
            <div class="form-group">
                <label for="return-date">Return Date</label>
                <input type="date" id="return-date" name="return_date">
            </div>
        </div>

        <!-- Passengers and Cabin Class -->
        <div class="form-row">
            <div class="form-group">
                <label for="passengers">Passengers</label>
                <input type="number" id="passengers" name="passengers" min="1" max="9" value="1" required>
            </div>
            <div class="form-group">
                <label for="cabin-class">Class</label>
                <select id="cabin-class" name="cabin_class">
                    <option value="economy">Economy</option>
                    <option value="premium-economy">Premium Economy</option>
                    <option value="business">Business</option>
                    <option value="first">First Class</option>
                </select>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Search Flights</button>
        
    </form>
</div>

</body>
</html>
